[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoforge"
version = "0.1.0"
description = "世界顶级时间序列预测系统 · ChronoFuse 融合旗舰（作者：晨星）"
authors = [{ name = "晨星" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.10"]

[project.scripts]
chronoforge = "chronoforge.cli:main"

[tool.setuptools.packages.find]
include = ["chronoforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
addopts = "-q -W ignore::UserWarning"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "RUF", "PLW", "BLE"]
# RUF001/002/003：本项目文档字符串与注释按交付要求以中文编写，
# 全角标点（（）：，等）会触发 ambiguous-unicode 告警，属排版而非缺陷，故豁免。
ignore = ["PLW1510", "RUF015", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW", "BLE", "RUF"]

[tool.ruff.format]
quote-style = "double"
